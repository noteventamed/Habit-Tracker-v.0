<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eff4f9"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Habits"><title>Today · My Habits</title><style>
:root{--bg:#eff4f9;--ink:#465674;--muted:#a8b0c0;--card:#fff;--soft:#f4f5f7;--accent:#8eafca}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.app{max-width:540px;margin:auto;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 30px) 22px calc(115px + env(safe-area-inset-bottom))}.header{display:flex;align-items:center;justify-content:space-between;margin:10px 0 30px}.header h1{font-size:29px;letter-spacing:-.6px;margin:0;font-weight:750}.square{border:0;border-radius:22px;width:54px;height:54px;background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink);font-size:25px}.cards{display:grid;gap:12px}.habit{background:var(--card);border-radius:30px;display:flex;align-items:center;padding:10px;min-height:100px;box-shadow:0 14px 24px -26px #26384f99;gap:13px}.emoji{flex:0 0 75px;height:75px;background:var(--soft);border-radius:24px;display:grid;place-items:center;font-size:35px}.detail{flex:1;min-width:0}.habitname{font-size:18px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:13px;font-weight:650;color:var(--muted);margin-top:4px}.bar{height:5px;background:#edf0f4;border-radius:20px;margin-top:10px;overflow:hidden}.fill{height:100%;border-radius:20px;transition:width .2s}.count{font-size:21px;font-weight:750;min-width:22px;text-align:center}.tap{border:0;background:transparent;color:var(--muted);font-size:34px;line-height:1;width:43px;height:60px;touch-action:manipulation;user-select:none;-webkit-user-select:none}.tap:active{transform:scale(.9)}.tap.full{opacity:.5}.empty{text-align:center;color:var(--muted);padding:50px 20px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:36px 36px 0 0;padding:17px max(24px,calc((100vw - 490px)/2)) calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;box-shadow:0 -6px 28px #36496908}.nav button{border:0;background:none;color:#aeb6c2;font-size:26px;width:66px;height:44px}.nav button.active{color:var(--ink)}.page{display:none}.page.active{display:block}.panel{background:white;border-radius:26px;padding:20px;margin:12px 0}.panel h2{font-size:19px;margin:0 0 15px}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:13px;font-weight:700}.field input,.field select{width:100%;border:1px solid #e4e7ec;background:#fafbfc;color:#34425b;padding:12px 13px;border-radius:14px;min-height:45px}.field input[type=color]{padding:4px;height:46px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:15px;background:var(--ink);color:white;padding:13px 18px;font-weight:700}.btn.secondary{background:#eef0f4;color:var(--ink)}.btn.danger{background:#fce8ea;color:#aa4a5a}.actions{display:flex;gap:8px;flex-wrap:wrap}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.small{font-size:13px;color:var(--muted)}.history-row{padding:12px 0;border-bottom:1px solid #edf0f4;display:flex;justify-content:space-between;gap:10px}.history-row:last-child{border:0}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{border:0;border-radius:11px;aspect-ratio:1;background:#f3f5f8;color:var(--ink);font-size:12px}.day.selected{outline:2px solid var(--ink)}.day.has{background:#dcebdc}.day.other{opacity:.25}.muted{color:var(--muted)}.settingrow{padding:12px 0;border-bottom:1px solid #eef0f3}.settingrow:last-child{border:0}dialog{border:0;border-radius:26px;padding:22px;width:min(94vw,430px);max-height:88dvh;overflow:auto;color:var(--ink)}dialog::backdrop{background:#26354a77}.hint{font-size:12px;color:var(--muted);line-height:1.5}.switch{display:flex;gap:8px}.switch button{flex:1;border:1px solid #dce1e8;background:white;color:var(--ink);border-radius:12px;padding:10px}.switch button.on{background:var(--ink);color:white}.stat{font-size:32px;font-weight:800}input[type=file]{max-width:100%}
</style></head><body><div class="app"><header class="header"><button class="square" id="settingsTop" aria-label="設定">⚙</button><h1 id="heading">Today</h1><button class="square" id="historyTop" aria-label="歷史紀錄">▤</button></header><main><section class="page active" id="today"><div class="cards" id="cards"></div><p class="hint" style="text-align:center;margin-top:22px">點 ＋ 一次增加 · 快速點兩下減少 · 長按卡片編輯</p></section><section class="page" id="history"><div class="panel"><div class="row"><button class="btn secondary" id="prevMonth">‹</button><strong id="monthLabel"></strong><button class="btn secondary" id="nextMonth">›</button></div><div class="calendar" id="calendar" style="margin-top:17px"></div></div><div class="panel"><h2 id="selectedLabel"></h2><div id="historyDetail"></div></div></section><section class="page" id="settings"><div class="panel"><h2>外觀設定</h2><div class="field"><label>背景顏色</label><input type="color" id="bgColor"></div><div class="field"><label>文字／主題顏色</label><input type="color" id="inkColor"></div><div class="field"><label>進度顯示</label><div class="switch"><button id="modeCount">次數</button><button id="modePercent">百分比</button></div></div></div><div class="panel"><h2>資料與備份</h2><p class="hint">資料儲存在這台裝置的瀏覽器。清除網站資料或更換手機可能造成紀錄遺失，請定期備份。</p><div class="actions"><button class="btn" id="exportBtn">匯出 JSON 備份</button><label class="btn secondary" for="importFile" style="cursor:pointer">匯入備份</label><input id="importFile" type="file" accept="application/json,.json" hidden></div></div><div class="panel"><h2>使用方式</h2><p class="small">每天以手機本地日期記錄。完成次數最高等於目標，不會超過 100%。雙擊 ＋ 可減少一次。長按卡片可編輯習慣。</p></div></section></main></div><nav class="nav"><button data-page="today" class="active" aria-label="今日">⌂</button><button id="addNav" aria-label="新增習慣">＋</button><button data-page="history" aria-label="歷史">▥</button><button data-page="settings" aria-label="設定">⚙</button></nav><dialog id="editor"><form id="habitForm"><h2 id="editorTitle">新增習慣</h2><div class="twocol"><div class="field"><label for="editEmoji">Emoji</label><input id="editEmoji" maxlength="12" placeholder="💧"></div><div class="field"><label for="editGoal">每日目標次數</label><input id="editGoal" type="number" min="1" max="9999" required></div></div><div class="field"><label for="editName">習慣名稱</label><input id="editName" maxlength="50" required></div><div class="field"><label for="editUnit">單位（可留空）</label><input id="editUnit" maxlength="20" placeholder="例如 CUPS"></div><div class="field"><label for="editColor">進度條顏色</label><input id="editColor" type="color"></div><div class="actions" style="margin-top:20px"><button class="btn" type="submit">儲存</button><button class="btn secondary" type="button" id="cancelEdit">取消</button><button class="btn danger" type="button" id="deleteHabit" hidden>刪除</button></div></form></dialog><script>
(()=>{'use strict';const KEY='my-habit-tracker-v1';const defaults={habits:[{id:'diet',name:'Diet',emoji:'💖',goal:1,unit:'',color:'#ed9cbd'},{id:'water',name:'Drink water',emoji:'💧',goal:5,unit:'CUPS',color:'#80bce8'},{id:'workout',name:'Workout',emoji:'❤️‍🔥',goal:1,unit:'',color:'#f2a275'}],logs:{},theme:{bg:'#eff4f9',ink:'#465674'},mode:'count'};let state;try{const saved=JSON.parse(localStorage.getItem(KEY));state=saved&&Array.isArray(saved.habits)&&saved.logs?{...structuredClone(defaults),...saved,theme:{...defaults.theme,...saved.theme}}:structuredClone(defaults)}catch{state=structuredClone(defaults)};let currentPage='today',editing=null,viewMonth=new Date(),selectedDate=dateKey(new Date());const $=id=>document.getElementById(id);function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function escape(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function todayCount(h){return Math.min(h.goal,Math.max(0,Number(state.logs[dateKey(new Date())]?.[h.id]||0)))}function render(){document.documentElement.style.setProperty('--bg',state.theme.bg);document.documentElement.style.setProperty('--ink',state.theme.ink);$('bgColor').value=state.theme.bg;$('inkColor').value=state.theme.ink;$('modeCount').classList.toggle('on',state.mode==='count');$('modePercent').classList.toggle('on',state.mode==='percent');$('cards').innerHTML=state.habits.length?state.habits.map(h=>{const n=todayCount(h),pct=Math.round(100*n/h.goal);return `<article class="habit" data-id="${escape(h.id)}"><div class="emoji">${escape(h.emoji||'✨')}</div><div class="detail"><div class="habitname">${escape(h.name)}</div><div class="sub">${state.mode==='percent'?pct+'%':n+' / '+h.goal+(h.unit?' '+escape(h.unit):'')}</div><div class="bar"><div class="fill" style="background:${h.color};width:${pct}%"></div></div></div><div class="count">${n}</div><button class="tap ${n>=h.goal?'full':''}" data-tap="${escape(h.id)}" aria-label="點一下增加，快速雙擊減少">＋</button></article>`}).join(''):'<div class="empty">還沒有習慣，點下方 ＋ 新增第一個吧。</div>';renderHistory()};let pending=new Map();function adjust(id,delta){const h=state.habits.find(x=>x.id===id);if(!h)return;const k=dateKey(new Date());state.logs[k]??={};state.logs[k][id]=Math.max(0,Math.min(h.goal,Number(state.logs[k][id]||0)+delta));save();render()};$('cards').addEventListener('click',e=>{const btn=e.target.closest('[data-tap]');if(!btn)return;const id=btn.dataset.tap;if(pending.has(id)){clearTimeout(pending.get(id));pending.delete(id);adjust(id,-1)}else{pending.set(id,setTimeout(()=>{pending.delete(id);adjust(id,1)},270))}});let holdTimer=null,holdStart=null;$('cards').addEventListener('pointerdown',e=>{if(e.target.closest('.tap'))return;const card=e.target.closest('.habit');if(!card)return;holdStart={x:e.clientX,y:e.clientY};holdTimer=setTimeout(()=>{openEditor(card.dataset.id);holdTimer=null},650)});for(const ev of ['pointerup','pointercancel','pointerleave'])$('cards').addEventListener(ev,()=>{clearTimeout(holdTimer);holdTimer=null});$('cards').addEventListener('pointermove',e=>{if(holdStart&&Math.hypot(e.clientX-holdStart.x,e.clientY-holdStart.y)>12)clearTimeout(holdTimer)});function showPage(page){currentPage=page;document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===page));document.querySelectorAll('.nav [data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));$('heading').textContent={today:'Today',history:'History',settings:'Settings'}[page];render()};document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));$('settingsTop').onclick=()=>showPage('settings');$('historyTop').onclick=()=>showPage('history');$('addNav').onclick=()=>openEditor();function openEditor(id=null){editing=id;const h=state.habits.find(x=>x.id===id);$('editorTitle').textContent=h?'編輯習慣':'新增習慣';$('editEmoji').value=h?.emoji||'✨';$('editName').value=h?.name||'';$('editGoal').value=h?.goal||1;$('editUnit').value=h?.unit||'';$('editColor').value=h?.color||'#80bce8';$('deleteHabit').hidden=!h;$('editor').showModal()};$('cancelEdit').onclick=()=>$('editor').close();$('habitForm').onsubmit=e=>{e.preventDefault();const name=$('editName').value.trim(),goal=Math.floor(Number($('editGoal').value));if(!name||!Number.isInteger(goal)||goal<1||goal>9999)return alert('請填寫有效名稱及 1–9999 的目標');const obj={id:editing||('h'+Date.now()),name,goal,emoji:$('editEmoji').value.trim()||'✨',unit:$('editUnit').value.trim(),color:$('editColor').value};if(editing){state.habits=state.habits.map(h=>h.id===editing?obj:h);for(const log of Object.values(state.logs))if(log[editing]!=null)log[editing]=Math.min(goal,Math.max(0,Number(log[editing])||0))}else state.habits.push(obj);save();$('editor').close();render()};$('deleteHabit').onclick=()=>{if(!editing||!confirm('確定刪除這個習慣？過去的紀錄也會一起刪除。'))return;state.habits=state.habits.filter(h=>h.id!==editing);for(const log of Object.values(state.logs))delete log[editing];save();$('editor').close();render()};$('bgColor').oninput=e=>{state.theme.bg=e.target.value;save();render()};$('inkColor').oninput=e=>{state.theme.ink=e.target.value;save();render()};$('modeCount').onclick=()=>{state.mode='count';save();render()};$('modePercent').onclick=()=>{state.mode='percent';save();render()};function renderHistory(){const year=viewMonth.getFullYear(),month=viewMonth.getMonth(),days=new Date(year,month+1,0).getDate(),offset=new Date(year,month,1).getDay();$('monthLabel').textContent=`${year} 年 ${month+1} 月`;$('calendar').innerHTML=['日','一','二','三','四','五','六'].map(x=>`<div class="small" style="text-align:center">${x}</div>`).join('')+Array.from({length:offset},()=>'<span></span>').join('')+Array.from({length:days},(_,i)=>{const d=i+1,k=dateKey(new Date(year,month,d)),log=state.logs[k],has=log&&Object.values(log).some(v=>Number(v)>0);return `<button class="day ${has?'has':''} ${k===selectedDate?'selected':''}" data-date="${k}">${d}</button>`}).join('');$('selectedLabel').textContent=selectedDate;const log=state.logs[selectedDate]||{};$('historyDetail').innerHTML=state.habits.map(h=>{const n=Math.max(0,Math.min(h.goal,Number(log[h.id]||0)));return `<div class="history-row"><span>${escape(h.emoji)} ${escape(h.name)}</span><strong>${n} / ${h.goal}</strong></div>`}).join('')||'<p class="small">尚無習慣</p>'};$('calendar').onclick=e=>{const d=e.target.closest('[data-date]');if(d){selectedDate=d.dataset.date;renderHistory()}};$('prevMonth').onclick=()=>{viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()-1,1);selectedDate=dateKey(viewMonth);renderHistory()};$('nextMonth').onclick=()=>{viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()+1,1);selectedDate=dateKey(viewMonth);renderHistory()};$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`habit-backup-${dateKey(new Date())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.habits)||!data.logs||typeof data.logs!=='object'||!data.theme)throw Error('格式錯誤');if(!confirm('匯入會覆蓋目前所有習慣與紀錄，確定繼續？'))return;state={habits:data.habits.filter(h=>typeof h.id==='string'&&typeof h.name==='string'&&Number.isInteger(h.goal)&&h.goal>0).map(h=>({...h,emoji:String(h.emoji||'✨'),unit:String(h.unit||''),color:/^#[0-9a-f]{6}$/i.test(h.color)?h.color:'#80bce8'})),logs:data.logs,theme:{bg:/^#[0-9a-f]{6}$/i.test(data.theme.bg)?data.theme.bg:defaults.theme.bg,ink:/^#[0-9a-f]{6}$/i.test(data.theme.ink)?data.theme.ink:defaults.theme.ink},mode:data.mode==='percent'?'percent':'count'};save();render();alert('匯入完成')}catch(err){alert('匯入失敗：'+err.message)}finally{e.target.value=''}};render()})();
</script></body></html>
